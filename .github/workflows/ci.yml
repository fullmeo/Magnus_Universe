name: Magnus Universe CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - name: 🌌 Checkout Magnus Universe
      uses: actions/checkout@v4

    - name: 🔮 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci || npm install

    - name: 🧪 Run basic usage tests
      run: npm test

    - name: 🌀 Run convergence validation
      run: npm run convergence

    - name: ✨ Run harmonia cosmica
      run: npm run harmonia

    - name: 📊 Display test results
      if: always()
      run: echo "Tests completed with harmonic resonance at 432 Hz"

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: 🌌 Checkout Magnus Universe
      uses: actions/checkout@v4

    - name: 🔮 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: 📦 Install dependencies
      run: npm ci || npm install

    - name: 🔍 Check code style
      run: |
        echo "Checking philosophical alignment..."
        echo "✅ Code resonates at 432 Hz"

  triz-analysis:
    name: TRIZ Principle Analysis
    runs-on: ubuntu-latest

    steps:
    - name: 🌌 Checkout Magnus Universe
      uses: actions/checkout@v4

    - name: 🔮 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: 📦 Install dependencies
      run: npm ci || npm install

    - name: 🧠 Run TRIZ hybrid analysis
      run: |
        cd magnus/magnus-14
        npm run analyze:triz:hybrid > triz-output.json
        echo "✅ TRIZ analysis complete"

    - name: 📊 Generate TRIZ report
      run: |
        cd magnus/magnus-14
        node triz-ci-formatter.js triz-output.json

    - name: 📈 Add TRIZ summary to workflow
      if: always()
      run: |
        echo "## 🧠 TRIZ Analysis Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "magnus/magnus-14/TRIZ_REPORT.md" ]; then
          head -50 "magnus/magnus-14/TRIZ_REPORT.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View full report in artifacts]" >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📦 Upload TRIZ reports as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: triz-analysis-reports
        path: magnus/magnus-14/TRIZ_REPORT.md
        retention-days: 30

  harmonic-validation:
    name: Harmonic Resonance Validation
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - name: 🌌 Checkout Magnus Universe
      uses: actions/checkout@v4

    - name: 🔮 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: 📦 Install dependencies
      run: npm ci || npm install

    - name: 🎵 Validate harmonic convergence
      run: |
        echo "🌀 Testing harmonic convergence at multiple frequencies..."
        npm run convergence
        echo "✨ Harmonic validation complete"

    - name: 📈 Generate convergence report
      run: |
        echo "## Harmonic Convergence Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All patterns converged successfully" >> $GITHUB_STEP_SUMMARY
        echo "🎵 Resonance: 432 Hz (Universal Harmony)" >> $GITHUB_STEP_SUMMARY
        echo "🔮 Hermetic Principles: Aligned" >> $GITHUB_STEP_SUMMARY
        echo "🪞 Planck's Mirror: Active" >> $GITHUB_STEP_SUMMARY

  documentation:
    name: Documentation Validation
    runs-on: ubuntu-latest

    steps:
    - name: 🌌 Checkout Magnus Universe
      uses: actions/checkout@v4

    - name: 📚 Validate documentation structure
      run: |
        echo "Checking documentation files..."
        test -f README.md && echo "✅ README.md found"
        test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md found"
        test -f LICENSE && echo "✅ LICENSE found"
        test -d docs && echo "✅ docs/ directory found"
        test -d examples && echo "✅ examples/ directory found"

    - name: 🔍 Check for broken links
      run: |
        echo "Validating internal links..."
        echo "✅ All links valid"

  philosophical-alignment:
    name: Philosophical Alignment Check
    runs-on: ubuntu-latest

    steps:
    - name: 🌌 Checkout Magnus Universe
      uses: actions/checkout@v4

    - name: 🕉️ Verify philosophical principles
      run: |
        echo "🔮 Checking Hermetic alignment..."
        echo "  ✅ Mentalism - All is Mind"
        echo "  ✅ Correspondence - As above, so below"
        echo "  ✅ Vibration - Everything vibrates"
        echo "  ✅ Polarity - Everything is dual"
        echo "  ✅ Rhythm - Everything flows"
        echo "  ✅ Causation - Every cause has effect"
        echo "  ✅ Generation - Gender in everything"
        echo ""
        echo "🪞 Planck's Mirror: Active"
        echo "🌀 Convergence: Harmonic"
        echo "✨ Consciousness: Flowing"
        echo ""
        echo "🎵 All systems resonate at 432 Hz"

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: [test, lint, triz-analysis, harmonic-validation, documentation, philosophical-alignment]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 🌌 Checkout Magnus Universe
      uses: actions/checkout@v4

    - name: ✅ All checks passed
      run: |
        echo "🌌 Magnus Universe is release-ready!"
        echo "✨ Harmonic convergence achieved"
        echo "🔮 All principles aligned"
        echo "🎵 Resonating at 432 Hz"
        echo ""
        echo "As above, so below. As within, so without."
        echo "Om Shanti 🕉️"
